AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TechLog Cloud - serverless digital aircraft technical log (portfolio project, synthetic data only)

Parameters:
  AlertEmail:
    Type: String
    Description: Email that receives AOG defect alerts (you must confirm the SNS subscription once)
    Default: ""

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Timeout: 20
    MemorySize: 256
    Runtime: python3.12
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref TechLogTable
        DOCS_BUCKET: !Ref DocsBucket
        AOG_TOPIC_ARN: !Ref AogTopic

Resources:

  # ---------- Data ----------
  TechLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: TechLog

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: TechLog

  AogTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: TechLog

  AogSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AogTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------- Auth ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: techlog-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireNumbers: true
          RequireUppercase: true
          RequireLowercase: true

  MechanicGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Mechanic

  CertifyingGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Certifying

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------- API + compute ----------
  TechLogApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizationType: JWT
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  TechLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: techlog-api
      CodeUri: src/
      Handler: app.handler
      Description: TechLog Cloud API - defect workflow, audit history, photo pre-signing
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TechLogTable
        - S3CrudPolicy:
            BucketName: !Ref DocsBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AogTopic.TopicName
      Events:
        CreateDefect:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /defects
            Method: POST
        ListDefects:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /defects
            Method: GET
        GetDefect:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /defects/{id}
            Method: GET
        ChangeStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /defects/{id}/status
            Method: PATCH
        PhotoUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /defects/{id}/photo-url
            Method: POST
        LogPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref TechLogApi
            Path: /tails/{tail}/logpage
            Method: GET

  # ---------- Frontend hosting ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: TechLog

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: techlog-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: API Gateway endpoint - paste into frontend config.js as API_BASE
    Value: !Sub https://${TechLogApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendUrl:
    Description: CloudFront URL for the TechLog web app
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: Upload frontend/ files here after deploy (see DEPLOY.md)
    Value: !Ref FrontendBucket
  UserPoolId:
    Description: Cognito user pool - paste into frontend config.js
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client - paste into frontend config.js
    Value: !Ref UserPoolClient
  Region:
    Description: Region you deployed to (use af-south-1)
    Value: !Ref AWS::Region
